name: CoreSense Auto-Build 🚀

on:
  push:
    branches: [ "master" ]
    tags:
      - "v1.0.2" # Запускає створення релізу при пуші тегу, наприклад v1.0.1
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Необхідно для створення релізів

    steps:
    - name: 📥 Отримання коду з репозиторію
      uses: actions/checkout@v4

    - name: 🛠 Налаштування MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: 🏗 Збірка проєкту (Release | x64)
      run: msbuild SysMonitorGUI.slnx /p:Configuration=Release /p:Platform=x64 /m

    - name: 🔑 Підготовка сертифіката для підпису
      shell: pwsh
      run: |
        $certBytes = [System.Convert]::FromBase64String("${{ secrets.CERTIFICATE_BASE64 }}")
        [System.IO.File]::WriteAllBytes("${{ github.workspace }}\cert.pfx", $certBytes)

    - name: ✍️ Підпис виконуваного файлу (SignTool)
      shell: pwsh
      run: |
        # Знаходимо signtool.exe саме в папці x64, щоб уникнути конфліктів архітектур
        $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1
        
        Write-Host "Використовується SignTool: $($signtool.FullName)"
        
        & $signtool.FullName sign /f "${{ github.workspace }}\cert.pfx" /p "${{ secrets.CERT_PASSWORD }}" /fd SHA256 /t http://timestamp.digicert.com /v "x64/Release/CoreSense.exe"

    - name: 📦 Збереження підписаного .exe як артефакту
      uses: actions/upload-artifact@v4
      with:
        name: CoreSense-Utility
        path: x64/Release/CoreSense.exe

    - name: 🚀 Створення GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: x64/Release/CoreSense.exe
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false