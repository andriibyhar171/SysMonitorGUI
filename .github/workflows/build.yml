name: CoreSense Auto-Build 🚀

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 📥 Отримання коду з репозиторію
      uses: actions/checkout@v4

    - name: 🛠 Налаштування MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: 🏗 Збірка проєкту (Release | x64)
      run: msbuild SysMonitorGUI.slnx /p:Configuration=Release /p:Platform=x64 /m

    - name: 🔑 Підготовка сертифіката для підпису
      shell: pwsh
      run: |
        $certBytes = [System.Convert]::FromBase64String("${{ secrets.CERTIFICATE_BASE64 }}")
        [System.IO.File]::WriteAllBytes("${{ github.workspace }}\cert.pfx", $certBytes)

    - name: ✍️ Підпис виконуваного файлу (SignTool)
      shell: pwsh
      run: |
        # Знаходимо signtool (він є в Windows SDK на сервері)
        $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Select-Object -First 1
        & $signtool.FullName sign /f "${{ github.workspace }}\cert.pfx" /p "${{ secrets.CERT_PASSWORD }}" /fd SHA256 /t http://timestamp.digicert.com /v "x64/Release/CoreSense.exe"

    - name: 📦 Збереження підписаного .exe як артефакту
      uses: actions/upload-artifact@v4
      with:
        name: CoreSense-Utility-v1.0.1
        path: x64/Release/CoreSense.exe