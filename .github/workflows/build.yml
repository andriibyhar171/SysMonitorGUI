name: CoreSense Auto-Build 🚀

on:
  push:
    branches: [ "master" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: 📥 Отримання коду з репозиторію
      uses: actions/checkout@v4

    - name: 🔍 Витягнення версії з SystemMonitor.h
      id: get_version
      shell: pwsh
      run: |
        #
        $line = Get-Content SysMonitorGUI/SystemMonitor.h | Where-Object { $_ -match '#define\s+CORESENSE_VERSION\s+"(v\d+\.\d+\.\d+)"' } | Select-Object -First 1
        if ($line -match '#define\s+CORESENSE_VERSION\s+"(v\d+\.\d+\.\d+)"') {
            $ver = $Matches[1]
            Write-Host "Знайдено версію в коді: $ver"
            Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$ver"
        } else {
            Write-Host "Помилка: Версію не знайдено у SystemMonitor.h!"
            exit 1
        }

    - name: 🛠 Налаштування MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: 🏗 Збірка проєкту (Release | x64)
      run: msbuild SysMonitorGUI.slnx /p:Configuration=Release /p:Platform=x64 /m

    - name: 🔑 Підготовка сертифіката для підпису
      shell: pwsh
      run: |
        $certBytes = [System.Convert]::FromBase64String("${{ secrets.CERTIFICATE_BASE64 }}")
        [System.IO.File]::WriteAllBytes("${{ github.workspace }}\cert.pfx", $certBytes)

    - name: ✍️ Підпис виконуваного файлу (SignTool)
      shell: pwsh
      run: |
        $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1
        Write-Host "Використовується SignTool: $($signtool.FullName)"
        & $signtool.FullName sign /f "${{ github.workspace }}\cert.pfx" /p "${{ secrets.CERT_PASSWORD }}" /fd SHA256 /t http://timestamp.digicert.com /v "x64/Release/CoreSense.exe"

    - name: 🗜️ Пакування у ZIP-архів (з розумною назвою)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "CoreSense"
        Copy-Item -Path "x64/Release/CoreSense.exe" -Destination "CoreSense\"
        
        Compress-Archive -Path "CoreSense" -DestinationPath "CoreSense_${{ env.APP_VERSION }}.zip" -Force

    - name: 📦 Збереження ZIP як артефакту
      uses: actions/upload-artifact@v4
      with:
        name: CoreSense-Utility-${{ env.APP_VERSION }}
        path: CoreSense_${{ env.APP_VERSION }}.zip

    - name: 🚀 Створення GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: CoreSense_${{ env.APP_VERSION }}.zip
        name: Release ${{ env.APP_VERSION }}
        draft: false
        prerelease: false